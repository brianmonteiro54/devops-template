# =============================================================================
# Drift Detection — togglemaster-infrastructure
# Usa CD reusable com is-drift-check=true (só plan, sem apply)
# =============================================================================

name: Drift Detection
run-name: "Drift Check — prod (${{ github.event_name }})"

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

concurrency:
  group: drift-prod
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  drift:
    uses: brianmonteiro54/devops-template/.github/workflows/terraform-cd.yml@main
    with:
      env-name: prod
      tfvars-path: envs/prod/terraform.tfvars
      backend-path: envs/prod/backend.hcl
      is-drift-check: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
