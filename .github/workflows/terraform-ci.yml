# =============================================================================
# Reusable Terraform CI Pipeline
# Repo: brianmonteiro54/devops-template
# Path: .github/workflows/terraform-ci.yml
# =============================================================================

name: Terraform CI (Reusable)

on:
  workflow_call:
    inputs:
      terraform-version:
        required: false
        type: string
        default: '1.14.5'
      tflint-version:
        required: false
        type: string
        default: 'v0.61.0'
      checkov-version:
        required: false
        type: string
        default: '3.2.354'
      checkov-skip-checks:
        required: false
        type: string
        default: 'CKV_AWS_119,CKV_AWS_28'
      trivy-severity:
        required: false
        type: string
        default: 'MEDIUM,HIGH,CRITICAL'
      aws-region:
        required: false
        type: string
        default: 'us-east-1'
      terraform-docs-working-dir:
        required: false
        type: string
        default: '.'
      enable-plan-preview:
        required: false
        type: boolean
        default: true
      environments:
        description: 'JSON array of {branch, env_name} for plan-preview matrix'
        required: false
        type: string
        default: '[{"branch":"main","env_name":"prod"},{"branch":"developer","env_name":"dev"}]'

    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false
      INFRACOST_API_KEY:
        required: false
      TF_BACKEND_BUCKET:
        required: false

permissions:
  contents: read
  pull-requests: write
  security-events: write

# =============================================================================
# Job 1: Lint & Format
# =============================================================================
jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Cache Terraform providers
        uses: actions/cache@v5
        with:
          path: |
            ~/.terraform.d/plugin-cache
            **/.terraform/providers
          key: tf-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: Configure Terraform plugin cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false -no-color

      - name: Cache TFLint plugins
        uses: actions/cache@v5
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}
          restore-keys: tflint-${{ runner.os }}-

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6.2.1
        with:
          tflint_version: ${{ inputs.tflint-version }}

      - name: Init TFLint
        run: tflint --init --config="${GITHUB_WORKSPACE}/.tflint.hcl"

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive -diff

      - name: TFLint
        id: tflint
        run: |
          tflint \
            --config="${GITHUB_WORKSPACE}/.tflint.hcl" \
            --format=compact \
            --recursive \
            --force 2>&1 | tee tflint_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Comment PR — Lint & Format
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          TFLINT_OUTCOME: ${{ steps.tflint.outcome }}
        with:
          script: |
            const fmtStatus    = process.env.FMT_OUTCOME;
            const tflintStatus = process.env.TFLINT_OUTCOME;
            const fmtIcon      = fmtStatus    === 'success' ? '✅' : '❌';
            const tflintIcon   = tflintStatus === 'success' ? '✅' : '⚠️';

            const body = [
              '## 🔍 Terraform Lint & Format',
              '',
              '| Check | Status |',
              '|-------|--------|',
              `| Terraform Format | ${fmtIcon} \`${fmtStatus}\` |`,
              `| TFLint | ${tflintIcon} \`${tflintStatus}\` |`,
              '',
              fmtStatus !== 'success'
                ? '> 💡 Execute `terraform fmt -recursive` localmente e faça commit.'
                : '',
              '',
              `_Commit: \`${context.sha}\`_`,
            ].filter(Boolean).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## 🔍 Terraform Lint & Format';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            const params = { owner: context.repo.owner, repo: context.repo.repo, body };

            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
            }

      - name: Evaluate results
        run: |
          if [[ "${{ steps.fmt.outcome }}" == "failure" ]]; then
            echo "::error::terraform fmt falhou. Execute 'terraform fmt -recursive' e faça commit."
            exit 1
          fi
          echo "✅ Lint & Format OK"

# =============================================================================
# Job 2: Validate
# =============================================================================
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Cache Terraform providers
        uses: actions/cache@v5
        with:
          path: |
            ~/.terraform.d/plugin-cache
            **/.terraform/providers
          key: tf-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: Configure Terraform plugin cache
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false -no-color

      - name: Terraform Validate
        id: validate
        shell: bash
        run: |
          set -o pipefail
          terraform validate -no-color 2>&1 | tee validate_output.txt

      - name: Comment PR — Validate
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const fs = require('fs');
            const status = process.env.VALIDATE_OUTCOME;
            const icon   = status === 'success' ? '✅' : '⚠️';

            let output = '';
            try {
              output = fs.readFileSync('validate_output.txt', 'utf8').trim();
            } catch (e) {
              output = 'Sem output disponível';
            }

            const MAX_LEN = 3000;
            if (output.length > MAX_LEN) {
              output = output.substring(0, MAX_LEN) + '\n\n... (truncado)';
            }

            const isModuleError = status === 'failure' &&
              (output.includes('modules/') && (output.includes('null') || output.includes('default')));

            const note = isModuleError
              ? '\n> ⚠️ Possível falha por `default = null` em módulo — não bloqueante.'
              : '';

            const body = [
              '## ⚙️ Terraform Validate',
              '',
              `**Status:** ${icon} \`${status}\`${note}`,
              '',
              '<details><summary>Ver output</summary>',
              '',
              '```',
              output,
              '```',
              '</details>',
              '',
              `_Commit: \`${context.sha}\`_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## ⚙️ Terraform Validate';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            const params = { owner: context.repo.owner, repo: context.repo.repo, body };

            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
            }

# =============================================================================
# Job 3: Security Scanning (Checkov + Trivy)
# =============================================================================
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.13.12'

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-checkov-${{ inputs.checkov-version }}

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.base_ref }}" == "main" || "${{ github.ref_name }}" == "main" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=dev" >> $GITHUB_OUTPUT
          fi

      - name: Install Checkov
        run: pip install checkov==${{ inputs.checkov-version }} --quiet

      - name: Run Checkov
        id: checkov
        run: |
          VARFILE_FLAG=""
          if [[ -f "envs/${{ steps.env.outputs.ENV_NAME }}/terraform.tfvars" ]]; then
            VARFILE_FLAG="--var-file envs/${{ steps.env.outputs.ENV_NAME }}/terraform.tfvars"
          fi

          checkov \
            --directory . \
            --framework terraform \
            --download-external-modules true \
            $VARFILE_FLAG \
            --output cli \
            --output json \
            --output-file-path console,checkov-report.json \
            --quiet \
            --compact \
            --skip-check ${{ inputs.checkov-skip-checks }} \
            2>&1 | tee checkov_output.txt

          CHECKOV_EXIT_CODE=${PIPESTATUS[0]}
          echo "exitcode=$CHECKOV_EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ $CHECKOV_EXIT_CODE -ne 0 ]; then
            echo "❌ Checkov encontrou falhas críticas de segurança."
            exit $CHECKOV_EXIT_CODE
          fi

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: checkov-report-${{ github.sha }}
          path: checkov-report.json
          retention-days: 30
          if-no-files-found: warn

      # ── Trivy ───────────────────────────────────────────────────────────────
      - name: Setup Terraform (for Trivy module resolution)
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false -no-color

      - name: Generate Trivy Config
        run: |
          VARFILE="envs/${{ steps.env.outputs.ENV_NAME }}/terraform.tfvars"
          if [[ -f "$VARFILE" ]]; then
            cat > trivy.yaml << EOF
          misconfiguration:
            terraform:
              vars:
                - $VARFILE
          EOF
          else
            echo "{}" > trivy.yaml
          fi

      - name: Run Trivy IaC scanner (Table)
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          trivy-config: trivy.yaml
          trivyignores: '.trivyignore'
          severity: ${{ inputs.trivy-severity }}
          exit-code: '1'
          format: 'table'
          output: 'trivy_output.txt'
          version: 'v0.69.3'
          skip-dirs: '.external_modules,.terraform'

      - name: Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          trivy-config: trivy.yaml
          trivyignores: '.trivyignore'
          severity: ${{ inputs.trivy-severity }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          skip-setup-trivy: true
          version: 'v0.69.3'
          skip-dirs: '.external_modules,.terraform'

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4.36.0
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: trivy-reports-${{ github.sha }}
          path: |
            trivy_output.txt
            trivy-results.sarif
          retention-days: 30
          if-no-files-found: warn

      - name: Comment PR — Security
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          CHECKOV_OUTCOME: ${{ steps.checkov.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        with:
          script: |
            const fs = require('fs');
            const checkovStatus = process.env.CHECKOV_OUTCOME;
            const trivyStatus   = process.env.TRIVY_OUTCOME;

            let checkovSummary = '_Relatório não disponível_';
            try {
              const raw = fs.readFileSync('checkov-report.json', 'utf8');
              const report = JSON.parse(raw);
              const results = Array.isArray(report) ? report : [report];
              const s = results.reduce((acc, r) => {
                const summary = r?.summary || {};
                acc.passed  += summary.passed  || 0;
                acc.failed  += summary.failed  || 0;
                acc.skipped += summary.skipped || 0;
                return acc;
              }, { passed: 0, failed: 0, skipped: 0 });
              checkovSummary = `✅ ${s.passed} passed · ❌ ${s.failed} failed · ⏭️ ${s.skipped} skipped`;
            } catch (e) {
              console.log(`Checkov report parse error: ${e.message}`);
            }

            let trivySummary = '_Relatório não disponível_';
            try {
              const trivyOutput = fs.readFileSync('trivy_output.txt', 'utf8');
              const totalLine = trivyOutput.split('\n').find(l => l.includes('Total:'));
              trivySummary = totalLine ? totalLine.trim() : (trivyStatus === 'success' ? 'Nenhum finding' : 'Ver output');
            } catch (e) {
              trivySummary = trivyStatus === 'success' ? 'Nenhum finding' : 'Ver aba Security';
            }

            const icon = (s) => s === 'success' ? '✅' : '⚠️';

            const body = [
              '## 🔒 Security Scanning',
              '',
              '| Scanner | Status | Detalhes |',
              '|---------|--------|----------|',
              `| Checkov | ${icon(checkovStatus)} \`${checkovStatus}\` | ${checkovSummary} |`,
              `| Trivy   | ${icon(trivyStatus)} \`${trivyStatus}\`   | ${trivySummary} |`,
              '',
              '> Findings de segurança são **warnings** — não bloqueiam merge, mas exigem revisão.',
              '',
              `_Commit: \`${context.sha}\`_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## 🔒 Security Scanning';
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            const params = { owner: context.repo.owner, repo: context.repo.repo, body };

            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
            }

# =============================================================================
# Job 4: Infracost — Cost Estimate (PRs only)
# =============================================================================
  infracost:
    name: Infracost Cost Estimate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # ── Checkout branch base para gerar baseline de custo ──────────────
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: '${{ github.event.pull_request.base.ref }}'

      - name: Generate Infracost cost baseline
        run: |
          VARFILE_FLAG=""
          if [[ -f "envs/${{ steps.env.outputs.ENV_NAME }}/terraform.tfvars" ]]; then
            VARFILE_FLAG="--terraform-var-file=envs/${{ steps.env.outputs.ENV_NAME }}/terraform.tfvars"
          fi

          infracost breakdown \
            --path=. \
            $VARFILE_FLAG \
            --format=json \
            --out-file=/tmp/infracost-base.json

      # ── Checkout branch do PR para calcular diff ───────────────────────
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Generate Infracost diff
        run: |
          VARFILE_FLAG=""
          if [[ -f "envs/${{ steps.env.outputs.ENV_NAME }}/terraform.tfvars" ]]; then
            VARFILE_FLAG="--terraform-var-file=envs/${{ steps.env.outputs.ENV_NAME }}/terraform.tfvars"
          fi

          infracost diff \
            --path=. \
            $VARFILE_FLAG \
            --format=json \
            --compare-to=/tmp/infracost-base.json \
            --out-file=/tmp/infracost.json

      # ── Postar comentário no PR ────────────────────────────────────────
      - name: Post Infracost comment
        run: |
          infracost comment github \
            --path=/tmp/infracost.json \
            --repo=$GITHUB_REPOSITORY \
            --github-token=${{ github.token }} \
            --pull-request=${{ github.event.pull_request.number }} \
            --behavior=update

# =============================================================================
# Job 5: Plan Preview (PRs only)
# =============================================================================
  plan-preview:
    name: Plan Preview (${{ matrix.env_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' && inputs.enable-plan-preview
    needs: [lint-format, validate]

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.environments) }}

    env:
      SHOULD_RUN: ${{ contains(github.base_ref, matrix.branch) }}

    steps:
      - name: Skip if not target env
        if: env.SHOULD_RUN != 'true'
        run: echo "⏭️ Skipping plan for ${{ matrix.env_name }}"

      - name: Checkout
        if: env.SHOULD_RUN == 'true'
        uses: actions/checkout@v6.0.2

      - name: Configure AWS Credentials
        if: env.SHOULD_RUN == 'true'
        uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Setup Terraform
        if: env.SHOULD_RUN == 'true'
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}

      - name: Cache Terraform providers
        if: env.SHOULD_RUN == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.terraform.d/plugin-cache
            **/.terraform/providers
          key: tf-providers-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-providers-${{ runner.os }}-

      - name: Configure Terraform plugin cache
        if: env.SHOULD_RUN == 'true'
        run: |
          mkdir -p ~/.terraform.d/plugin-cache
          echo 'plugin_cache_dir = "$HOME/.terraform.d/plugin-cache"' > ~/.terraformrc

      - name: Terraform Init
        if: env.SHOULD_RUN == 'true'
        run: |
          terraform init \
            -backend-config="envs/${{ matrix.env_name }}/backend.hcl" \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -reconfigure -input=false -no-color

      - name: Terraform Plan
        if: env.SHOULD_RUN == 'true'
        id: plan
        env:
          TF_VAR_aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          TF_VAR_aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TF_VAR_aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          set +e
          terraform plan \
            -var-file="envs/${{ matrix.env_name }}/terraform.tfvars" \
            -detailed-exitcode -input=false -no-color 2>&1 | tee plan_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          case $EXIT_CODE in
            0) echo "has_changes=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "has_changes=error" >> "$GITHUB_OUTPUT"; exit 1 ;;
            2) echo "has_changes=true"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Comment PR — Plan Preview
        if: env.SHOULD_RUN == 'true' && always()
        uses: actions/github-script@v8
        env:
          HAS_CHANGES: ${{ steps.plan.outputs.has_changes }}
          ENV_NAME: ${{ matrix.env_name }}
        with:
          script: |
            const fs = require('fs');
            const envName = process.env.ENV_NAME;
            const hasChanges = process.env.HAS_CHANGES;

            let planOutput = '_Plan output não disponível_';
            try { planOutput = fs.readFileSync('plan_output.txt', 'utf8').trim(); } catch (e) {}

            const MAX = 50000;
            if (planOutput.length > MAX) planOutput = planOutput.substring(0, MAX) + '\n\n... (truncado)';

            let statusLine;
            if (hasChanges === 'true') statusLine = '🔄 **Mudanças detectadas** — review o plan abaixo.';
            else if (hasChanges === 'error') statusLine = '❌ **Plan falhou** — corrija antes do merge.';
            else statusLine = '✅ **Sem mudanças**.';

            const body = [
              `## 📋 Plan Preview — \`${envName}\``,
              '', statusLine, '',
              '<details><summary>Ver plan completo</summary>', '',
              '```hcl', planOutput, '```',
              '</details>', '',
              `_Commit: \`${context.sha}\`_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = `## 📋 Plan Preview — \`${envName}\``;
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            else await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });

# =============================================================================
# Job 6: Terraform Docs
# =============================================================================
  docs:
    name: Terraform Docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Check terraform-docs
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: ${{ inputs.terraform-docs-working-dir }}
          output-file: README.md
          output-method: inject
          git-push: true

# =============================================================================
# Job 7: CI Gate
# =============================================================================
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-format, validate, security, infracost]
    if: always()

    steps:
      - name: Evaluate gate
        run: |
          echo "══════════════════════════════════════════════════"
          echo "   RESULTADOS DO CI"
          echo "══════════════════════════════════════════════════"
          echo "  Lint & Format : ${{ needs.lint-format.result }}"
          echo "  Validate      : ${{ needs.validate.result }}"
          echo "  Security      : ${{ needs.security.result }}"
          echo "  Infracost     : ${{ needs.infracost.result }}"
          echo "══════════════════════════════════════════════════"

          BLOCKING_FAILED=false

          if [[ "${{ needs.lint-format.result }}" == "failure" ]]; then
            echo "::error::BLOQUEANTE: Lint & Format falhou"
            BLOCKING_FAILED=true
          fi

          if [[ "${{ needs.validate.result }}" == "failure" ]]; then
            echo "::warning::Validate reportou problemas"
            BLOCKING_FAILED=true
          fi

          if [[ "${{ needs.security.result }}" == "failure" ]]; then
            echo "::warning::Security scan encontrou findings — revisão obrigatória"
          fi

          if [[ "${{ needs.infracost.result }}" == "failure" ]]; then
            echo "::warning::Infracost falhou — estimativa de custo indisponível"
          fi

          if [[ "$BLOCKING_FAILED" == "true" ]]; then
            echo "::error::CI falhou."
            exit 1
          fi

          echo "✅ CI passou."

      - name: Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          ICON=$([[ "$STATUS" == "success" ]] && echo "✅ Passou" || echo "❌ Falhou")

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### CI Pipeline — ${ICON}

          | Job | Resultado | Tipo |
          |-----|-----------|------|
          | Lint & Format | \`${{ needs.lint-format.result }}\` | 🔒 Bloqueante |
          | Validate      | \`${{ needs.validate.result }}\`    | 🔒 Bloqueante |
          | Security      | \`${{ needs.security.result }}\`    | 🔒 Bloqueante |
          | Infracost     | \`${{ needs.infracost.result }}\`   | 💰 Informativo |
          EOF